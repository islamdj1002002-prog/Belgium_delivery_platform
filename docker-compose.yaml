services:
  db:
    image: postgres:15
    container_name: saffier_express_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "5434:5432"
    volumes:
      - saffier_pg_data:/var/lib/postgresql/data
volumes:
  saffier_pg_data: